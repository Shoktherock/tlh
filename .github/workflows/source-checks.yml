name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-publication.mjs
      - run: npm ci
      - run: npm run test:tlh
      - run: npm test
      - run: npm run build
      - run: npm run build:tlh
      - run: npm run build:imports
      - run: npm audit --omit=dev --audit-level=high
